<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Do You Love Me? 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Patrick Hand', cursive;
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-image: url('images/background.png'); /* الخلفية */
  background-size: cover;
  background-position: center;
  overflow: hidden;
}

.container {
  background: rgba(255,240,248,0.92);
  padding: 30px;
  border-radius: 25px;
  text-align: center;
  max-width: 400px;
  box-shadow: 0 0 30px rgba(255,120,180,0.7);
}

h1 {
  font-size:2.2em;
  color:#ff4fa3;
  animation:pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

button {
  padding: 15px 30px;
  margin: 10px;
  font-size:1.2em;
  border:none;
  border-radius:15px;
  cursor:pointer;
  transition: transform 0.2s;
}
button:hover { transform: scale(1.1); }
.yes-btn{ background:#ff99cc; color:white; }
.no-btn{ background:#ff4d94; color:white; position:relative; }

.hello-kitty { width:140px; margin-top:20px; transition: transform 0.3s; }
.progress { margin-top:20px; font-size:1.5em; color:#ff3399; }

/* القلوب */
.heart, .rain-heart {
  position:absolute; pointer-events:none;
  background-image:url('images/heart.png');
  background-size:cover;
}
.heart { width:30px; height:30px; animation:floatUp 1.5s forwards; }
@keyframes floatUp {
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-150px) scale(1.5);}
}
.rain-heart { width:25px; height:25px; animation:rainHearts 3s linear forwards; }
@keyframes rainHearts {
  0%{opacity:1;transform:translateY(-50px);}
  100%{opacity:0;transform:translateY(600px);}
}

/* الرسائل الرومانسية */
.message {
  position: absolute;
  top: -50px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.8);
  padding: 15px 25px;
  border-radius: 20px;
  color: #ff3399;
  font-size: 1.5em;
  font-weight: bold;
  text-align: center;
  box-shadow: 0 0 20px rgba(255,100,180,0.7);
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
  animation: none;
}

@keyframes showMessage {
  0% { top: -50px; opacity: 0; transform: translateX(-50%) scale(0.8); }
  50% { top: 150px; opacity: 1; transform: translateX(-50%) scale(1.1); }
  100% { top: 120px; opacity: 1; transform: translateX(-50%) scale(1); }
}
</style>
</head>
<body>
<div class="container">
  <h1>Do you love me? 💖</h1>
  <img class="hello-kitty" src="images/hello-kitty.png" alt="Hello Kitty">
  <div>
    <button class="yes-btn">Yes</button>
    <button class="no-btn">No</button>
  </div>
  <div class="progress">❤️ Love Level: 0</div>
</div>

<script>
const yesBtn=document.querySelector('.yes-btn');
const noBtn=document.querySelector('.no-btn');
const progress=document.querySelector('.progress');
const kitty=document.querySelector('.hello-kitty');
let loveLevel=0;

function createHeart(x,y){
  const h=document.createElement('div');
  h.className='heart';
  h.style.left=x+'px'; h.style.top=y+'px';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),1500);
}

function rainHearts(){
  for(let i=0;i<5;i++){
    const r=document.createElement('div');
    r.className='rain-heart';
    r.style.left=Math.random()*window.innerWidth+'px';
    document.body.appendChild(r);
    setTimeout(()=>r.remove(),3000);
  }
}

function kittyJump(){
  kitty.style.transform=`scale(${1+loveLevel*0.05}) translate(${Math.random()*30-15}px,-20px) rotate(${Math.random()*30-15}deg)`;
  setTimeout(()=>kitty.style.transform=`scale(${1+loveLevel*0.05}) translate(0,0) rotate(0)`,300);
}

function showMessage(text){
  const msg = document.createElement('div');
  msg.className = 'message';
  msg.textContent = text;
  document.body.appendChild(msg);
  msg.style.animation = 'showMessage 1.5s forwards';
  setTimeout(()=>msg.remove(),3000);
}

yesBtn.addEventListener('click',(e)=>{
  loveLevel++;
  progress.textContent=`❤️ Love Level: ${loveLevel}`;
  const r=e.target.getBoundingClientRect();
  createHeart(r.left+20,r.top);
  createHeart(r.left+60,r.top);
  kittyJump();
  rainHearts();

  // الرسائل حسب Love Level
  if(loveLevel===10){
    showMessage("💖 I knew it… you love me forever 😳💍");
  } else if(loveLevel===15){
    showMessage("💌 Aji ntzwjo… 🥰");
  } else if(loveLevel===20){
    showMessage("💖 Ryhab holi elia lbab… ana jit ntzwjo 😘");
  } else if(loveLevel===25){
    showMessage("💘 You are my everything… I love you endlessly 💖");
  }
});

noBtn.addEventListener('mouseover',()=>{
  const x=Math.random()*(window.innerWidth-100);
  const y=Math.random()*(window.innerHeight-50);
  noBtn.style.position='absolute';
  noBtn.style.left=x+'px';
  noBtn.style.top=y+'px';
});

setInterval(()=>{
  const r=document.createElement('div');
  r.className='rain-heart';
  r.style.left=Math.random()*window.innerWidth+'px';
  r.style.top=window.innerHeight+'px';
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),3000);
},900);
</script>
</body>
</html>
